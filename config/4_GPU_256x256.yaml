# 4× A40 40GB DDP Training (0718)
# 对齐 0703 基线配置，增加三阶段 LR + NaN 恢复
# ⚠️ 本配置针对 256×256 相位数据设计

num_epochs: 550

# 数据路径（相位 NPZ 数据根目录，含 train/ 与 test/ 子目录）
data_dir: data/minst_phase

# 数据并行
batch_size_per_gpu: 48          # A40 48G: 48×4=192 effective
gradient_accumulation_steps: 1

# 学习率
learning_rate: 3.0e-5           # 0703 验证稳定的峰值 LR
warmup_epochs: 5                # Linear warmup
flat_epochs: 200                # 保持峰值 LR 不变
# Cosine decay 自动计算: num_epochs - warmup - flat = 345

# 扩散
timesteps: 1000
schedule_type: cosine

# 采样
sample_interval: 20             # 每 N 个 epoch 采样一次

# 优化器
weight_decay: 0.01              # 与 0703 一致
grad_clip_max_norm: 1.0         # 与 0703 一致

# NaN 恢复
nan_loss_threshold: 5           # 连续 NaN loss 次数触发恢复
nan_grad_threshold: 20          # 连续 NaN gradient norm 次数触发恢复
nan_recovery_lr_factor: 0.7     # 恢复时 LR 乘以该因子

# 日志
log_interval: 100

# 模型架构 (ConditionalDiT-B, 输入 256×256)
model:
  img_size: 256
  patch_size: 8
  in_channels: 1
  hidden_dim: 768
  num_heads: 12
  num_layers: 12
  time_dim: 256
  num_classes: 10
  mlp_ratio: 4

# W&B
wandb_project: minst
wandb_name_ddp: conditional_dit_phase_hologram_ddp
wandb_name_single: conditional_dit_phase_hologram
